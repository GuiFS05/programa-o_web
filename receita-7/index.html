<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="script.js"></script>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div><button id="botaoCarregar">Carregando cervejas...</button></div>
    <div id="cervejasDiv"></div>
  </body>
  <script>
    async function carregarCervejas() {
      try {
        let res = await fetch("https://jsonplaceholder.typicode.com/users");
        cervejas = await res.json();
        carregarTabela(cervejas,"cervejasDiv",Object.keys(cervejas[0]));
      } catch (err) {
        console.error(err);
        document.getElementById("cervejasDiv").innerHTML = "Ih Fudeu, Guilherme apareceu!";
      }
    }
    let botao = document.getElementById("botaoCarregar");
    botao.addEventListener("click", () => carregarCervejas());
  </script>
</html>
